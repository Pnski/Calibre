name: Build Zip

on:
  push:
    branches:
      - '**'
    paths:
      - 'Plugins/METADATA-rndb-local/**'
      - 'calibre-plugin/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: METADATA-rndb-local-${{GITHUB_SHA::7}}
          path: |
            Plugins/METADATA-rndb-local/
            !Plugins/METADATA-rndb-local/test.py