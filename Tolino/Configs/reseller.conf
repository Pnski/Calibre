        "language": "DE",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "Wie kaufe ich ein Buch oder ein Hörbuch? ##Leider sind Einkäufe über diese App nicht möglich. Deine Bücher und Hörbücher kannst Du bequem im reseller-Shop erwerben. Nutze einfach die Funktion “Link kopieren”, um schnell das gewünschte Buch oder Hörbuch in Deinem Buchhändler-Shop zu finden. Für neue Inspirationen stehen Dir kostenlose Lese- und Hörproben jederzeit zur Verfügung. # Deine Käufe werden Dir automatisch in der tolino app angezeigt, sofern Du mit dem gleichen Kundenkonto angemeldet bist. ",
            "SOKA_ANNOUNCEMENT_TEXT": "Wichtiger Hinweis #Ab der nächsten Version Anfang April wird es aufgrund geänderter Geschäftsbedingungen von Google nicht mehr möglich sein, Bücher und Hörbücher direkt aus der tolino app heraus zu kaufen. Damit Du dennoch immer Dein nächstes Lieblingsbuch oder -hörbuch bei uns entdecken kannst, werden wir Dir stattdessen eine Auswahl an Empfehlungen anbieten. Gerne kannst Du dann ein Buch oder ein Hörbuch auch weiterhin über unseren [Reseller]-Onlineshop erwerben, jedoch leider nicht mehr direkt über diese App.",
            "STRING_ARRAY_ACTIVATION_ADVANTAGES": "Wählen Sie aus über einer Million eBooks im Thalia eBook-Shop Ihre persönlichen Highlights.##Lesen Sie mit der Thalia eReading App auch parallel auf dem Tablet oder Smartphone.##Synchronisieren Sie Ihre eBooks sicher, komfortabel und kostenlos über die tolino Cloud auf verschiedenen Geräten.##Nutzen Sie mit Ihrem tolino alle HotSpots der Deutschen Telekom kostenlos.",
            "SOKA_INFO_IOS": "Wie kaufe ich ein Buch oder ein Hörbuch? ## Leider sind Einkäufe über diese App nicht möglich. Ihre Bücher und Hörbücher können Sie bequem im reseller-Shop erwerben. Nutzen Sie einfach die Funktion “ISBN kopieren”, um schnell das gewünschte Buch oder Hörbuch in Ihrem Buchhändler-Shop zu finden. Für neue Inspirationen stehen Ihnen kostenlose Lese- und Hörproben jederzeit zur Verfügung. Ihre Käufe werden Ihnen automatisch in der tolino app angezeigt, sofern Sie mit dem gleichen Kundenkonto angemeldet sind. ## Wieso kann ich in der tolino app keine Käufe tätigen? ## Aufgrund der Geschäftsbedingungen von Apple ist uns dies leider nicht möglich. Damit Sie dennoch immer Ihr nächstes Lieblingsbuch oder -hörbuch bei uns entdecken können, haben wir eine Auswahl an persönlichen Empfehlungen für Sie zusammengestellt.",
            "STRING_ARRAY_SUPPORT_CONTACT": "deine mudda: info@thalia.de##Rufnummer: 0251 5309 444##(Montag bis Freitag 9 - 18 Uhr, Samstag 9:30 - 18 Uhr)"
        }
    }, {
        "language": "EN",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "How do I buy a book or audiobook? ##Unfortunately, purchases are not possible via this app. You can conveniently purchase your books and audiobooks in the reseller store. Just use the \"copy link\" function to quickly find the book or audiobook you want in your bookseller store. For new inspiration, free reading and listening samples are always available. # Your purchases are automatically displayed in the tolino app, as long as you are logged in with the same customer account.",
            "SOKA_ANNOUNCEMENT_TEXT": "Important notice #In the next version at the beginning of April, it will no longer be possible to buy books and audiobooks directly from the tolino app due to changes in Google's terms and conditions. To ensure that you can always discover your next favorite book or audiobook with us, we will offer you a selection of recommendations instead. You will still be able to purchase a book or audiobook through our [reseller] online store, but unfortunately no longer directly through this app.",
            "STRING_ARRAY_ACTIVATION_ADVANTAGES": "Browse through over 1,000,000 e-books in the Thalia shop.##Use the Thalia eBooks app to read in parallel on your tablet, computer or smartphone.##Synchronize your titles across various devices securely and free of charge via the tolino Cloud.##Use all Deutsche Telekom HotSpots free of charge with your tolino.",
            "SOKA_INFO_IOS": "How do I buy a book or audiobook? ## Unfortunately, purchases are not possible via this app. You can conveniently purchase your books and audiobooks in the reseller store. Simply use the \"Copy ISBN\" function to quickly find the book or audiobook you want in your bookseller store. For new inspiration, free reading and audio samples are always available. Your purchases are automatically displayed in the tolino app if you are logged in with the same customer account. ## Why can't I purchase in the tolino app? ## Unfortunately, due to Apple's terms and conditions, we are unable to do so. However, to ensure that you can always discover your next favorite book or audiobook with us, we've put together a selection of personal recommendations for you.",
            "STRING_ARRAY_SUPPORT_CONTACT": "deine mudda: info@thalia.de##Hotline: +49 (0)251 530 94 44##(German speaking customer care:##Monday to Friday, 9 a.m. to 6 p.m.)"
        }
    }, {
        "language": "IT",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "Come faccio a comprare un libro o un audiolibro? ##Purtroppo, gli acquisti non sono possibili tramite questa app. Puoi acquistare comodamente i tuoi libri e audiolibri nel negozio del rivenditore. Basta usare la funzione \"Copia link\" per trovare rapidamente il libro o l'audiolibro desiderato nel tuo negozio di libri. Per una nuova ispirazione, i campioni di lettura e di ascolto gratuiti sono disponibili in qualsiasi momento. # I tuoi acquisti vengono visualizzati automaticamente nell'app tolino se hai effettuato l'accesso con lo stesso account cliente. ",
            "STRING_ARRAY_ACTIVATION_ADVANTAGES": "Scegli le tue letture preferite tra oltre un milione di eBook nell'eBook shop Thalia.##Con l'app Thalia eReading, leggi in parallelo anche sul tablet o lo smartphone.##Sincronizza i tuoi eBook in modo sicuro, comodo e gratuito su dispositivi diversi tramite tolino Cloud.##Con il tuo tolino, sfrutta gratis tutti gli hot spot di Deutsche Telekom.",
            "SOKA_INFO_IOS": "Come posso comprare un libro o un audiolibro? ## Purtroppo gli acquisti non sono possibili tramite questa app. Puoi acquistare comodamente i tuoi libri e audiolibri dal negozio online di reseller. Basta usare la funzione \"Copia ISBN\" per trovare rapidamente il libro o l'audiolibro che vuoi nel tuo negozio di libri. Per una nuova ispirazione, la lettura gratuita e i campioni audio sono disponibili per voi in qualsiasi momento. I tuoi acquisti vengono visualizzati automaticamente nell'app tolino, a condizione che tu abbia effettuato l'accesso con lo stesso account cliente. ## Perché non posso fare acquisti nell'app tolino? ## Purtroppo, a causa dei termini e delle condizioni di Apple, non siamo in grado di farlo. Tuttavia, affinché tu possa sempre scoprire il tuo prossimo libro o audiolibro preferito con noi, abbiamo messo insieme una selezione di raccomandazioni personali per te.",
            "STRING_ARRAY_SUPPORT_CONTACT": "deine mudda: info@thalia.de##Hot line: +49 (0) 251 530 94 44##(da lunedì a venerdì, dalle ore 9 alle ore 18)"
        }
    }, {
        "language": "NL_BE",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "Hoe koop ik een boek of een audioboek? ##Helaas zijn aankopen via deze app niet mogelijk. U kunt uw boeken en audioboeken gemakkelijk kopen in de wederverkoperswinkel. Gebruik gewoon de functie \"Link kopiëren\" om snel het gewenste boek of audioboek in uw boekhandel te vinden. Voor nieuwe inspiratie zijn er te allen tijde gratis lees- en luistervoorbeelden beschikbaar. # Uw aankopen worden automatisch weergegeven in de tolino app als u bent ingelogd met dezelfde klantenaccount. "
        }
    }, {
        "language": "FR",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "Comment acheter un livre ou un livre audio ? ##Malheureusement, les achats via cette application ne sont pas possibles. Tu peux facilement acheter tes livres et livres audio dans la boutique du revendeur. Utilise simplement la fonction \"Copier le lien\" pour trouver rapidement le livre ou le livre audio souhaité dans ta boutique de librairie. Pour te donner de nouvelles inspirations, des échantillons gratuits de lecture et d'écoute sont à ta disposition à tout moment. # Tes achats sont automatiquement affichés dans l'app tolino, à condition que tu sois connecté avec le même compte client. ",
            "STRING_ARRAY_ACTIVATION_ADVANTAGES": "Choisissez vos coups de cœur personnels parmi plus d'un million d'ebooks dans l'ebook-shop de Thalia.##Lisez parallèlement sur la tablette ou sur le smartphone avec l'appli eReading de Thalia.##Synchronisez vos ebooks en sécurité, confortablement et gratuitement à travers le tolino Cloud sur plusieurs appareils.##Avec votre tolino, utilisez gratuitement tous les hotspots de la Deutsche Telekom.",
            "SOKA_INFO_IOS": "Comment acheter un livre ou un livre audio ? ## Malheureusement, les achats ne sont pas possibles via cette application. Vous pouvez facilement acheter vos livres et livres audio dans la boutique des reseller. Il suffit d'utiliser la fonction \"Copier l'ISBN\" pour trouver rapidement le livre ou le livre audio que vous souhaitez dans la boutique de votre libraire. Pour une nouvelle inspiration, des lectures gratuites et des échantillons audio sont à votre disposition à tout moment. Vos achats sont automatiquement affichés dans l'appli tolino, à condition que vous soyez connecté avec le même compte client. ## Pourquoi ne puis-je pas effectuer des achats dans l'application tolino ? ## Malheureusement, en raison des conditions générales d'Apple, nous ne pouvons pas le faire. Toutefois, pour que vous puissiez toujours découvrir votre prochain livre ou livre audio préféré avec nous, nous avons rassemblé pour vous une sélection de recommandations personnelles.",
            "STRING_ARRAY_SUPPORT_CONTACT": "deine mudda: info@thalia.de##Hotline: +49 (0) 251 530 94 44##(Du lundi au vendredi de 9 h à 18 h)"
        }
    }, {
        "language": "ES",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "¿Cómo puedo comprar un libro o un audiolibro? ##Desgraciadamente, las compras no son posibles a través de esta aplicación. Puede adquirir cómodamente sus libros y audiolibros en la tienda de reventa. Sólo tiene que utilizar la función \"Copiar enlace\" para encontrar rápidamente el libro o audiolibro deseado en su librería. Para una nueva inspiración, hay muestras gratuitas de lectura y escucha disponibles en cualquier momento. # Tus compras se muestran automáticamente en la aplicación tolino si te conectas con la misma cuenta de cliente. ",
            "STRING_ARRAY_ACTIVATION_ADVANTAGES": "Seleccione de entre más de un millo de libros electrónicos en la tienda de eBooks de Thalia su destacados personalizados.##Lea de forma paralela con la aplicación de lectura digital de Thalia en su tableta o smartphone.##Sincronice sus libros electrónicos de forma segura, cómoda y gratuita a través de la tolino Cloud en distintos dispositivos.##Utilice con su dispositivo tolino de forma gratuita todos los HotSpots de la Deutsche Telekom.",
            "SOKA_INFO_IOS": "¿Cómo puedo comprar un libro o un audiolibro? ## Lamentablemente, las compras no son posibles a través de esta aplicación. Puede adquirir cómodamente sus libros y audiolibros en la tienda de reseller. Sólo tiene que utilizar la función \"Copiar ISBN\" para encontrar rápidamente el libro o audiolibro que desea en su librería. Para una nueva inspiración, tiene a su disposición muestras gratuitas de lectura y audio en cualquier momento. Tus compras se muestran automáticamente en la app de tolino, siempre que estés conectado con la misma cuenta de cliente. ## ¿Por qué no puedo hacer compras en la aplicación tolino? ## Lamentablemente, debido a los términos y condiciones de Apple, no podemos hacerlo. Sin embargo, para que siempre pueda descubrir su próximo libro o audiolibro favorito con nosotros, hemos reunido una selección de recomendaciones personales para usted.",
            "STRING_ARRAY_SUPPORT_CONTACT": "deine mudda: info@thalia.de##Línea directa: +49 (0) 251 530 94 44##(Lunes a viernes de 9:00 a 18:00 horas)"
        }
    }, {
        "language": "NL",
        "languageConfig": {
            "SOKA_INFO_ANDROID": "Hoe koop ik een boek of een audioboek? ##Helaas zijn aankopen via deze app niet mogelijk. U kunt uw boeken en audioboeken gemakkelijk kopen in de wederverkoperswinkel. Gebruik gewoon de functie \"Link kopiëren\" om snel het gewenste boek of audioboek in uw boekhandel te vinden. Voor nieuwe inspiratie zijn er te allen tijde gratis lees- en luistervoorbeelden beschikbaar. # Uw aankopen worden automatisch weergegeven in de tolino app als u bent ingelogd met dezelfde klantenaccount. ",
            "STRING_ARRAY_ACTIVATION_ADVANTAGES": "Kies uit meer dan een miljoen ebooks in de Thalia eBook-Shop uw persoonlijke favorieten.##Lees met de Thalia eReading-app ook parallel op de tablet of smartphone.##Synchroniseer uw ebooks veilig, comfortabel en kosteloos via de tolino Cloud op verschillende apparaten.##Maak met uw tolino gratis gebruik van alle HotSpots van de Deutsche Telekom.",
            "SOKA_INFO_IOS": "Hoe koop ik een boek of een audioboek? ## Helaas zijn aankopen via deze app niet mogelijk. U kunt uw boeken en audioboeken gemakkelijk kopen in de reseller Winkel. Gebruik gewoon de functie \"ISBN kopiëren\" om snel het boek of audioboek te vinden dat u in uw boekhandel wilt hebben. Voor nieuwe inspiratie kunt u te allen tijde gebruik maken van gratis lees- en geluidsvoorbeelden. Uw aankopen worden automatisch weergegeven in de tolino app, mits u bent ingelogd met dezelfde klantenaccount. ## Waarom kan ik geen aankopen doen in de tolino app? ## Helaas, vanwege de voorwaarden van Apple, kunnen we dat niet doen. Maar zodat u altijd uw volgende favoriete boek of luisterboek bij ons kunt ontdekken, hebben wij een selectie van persoonlijke aanbevelingen voor u samengesteld.",
